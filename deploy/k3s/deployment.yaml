apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcskin
  namespace: mcskin-migration
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcskin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcskin
    spec:
      initContainers:
        - name: prepare-data-directories
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /data/storage /data/plugins /data/public-lang /data/public-plugins
          volumeMounts:
            - name: data
              mountPath: /data
        - name: initialize-data
          image: ghcr.io/example/redstone-skin-server-app:b69faa4d
          command: ["/bin/true"]
          envFrom:
            - configMapRef:
                name: mcskin-config
            - secretRef:
                name: mcskin-secrets
          volumeMounts:
            - name: data
              mountPath: /var/www/html/storage
              subPath: storage
            - name: data
              mountPath: /var/www/html/plugins
              subPath: plugins
            - name: data
              mountPath: /var/www/html/public/lang
              subPath: public-lang
            - name: data
              mountPath: /var/www/html/public/plugins
              subPath: public-plugins
      containers:
        - name: app
          image: ghcr.io/example/redstone-skin-server-app:b69faa4d
          envFrom:
            - configMapRef:
                name: mcskin-config
            - secretRef:
                name: mcskin-secrets
          ports:
            - name: fastcgi
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/storage
              subPath: storage
            - name: data
              mountPath: /var/www/html/plugins
              subPath: plugins
            - name: data
              mountPath: /var/www/html/public/lang
              subPath: public-lang
            - name: data
              mountPath: /var/www/html/public/plugins
              subPath: public-plugins
        - name: web
          image: ghcr.io/example/redstone-skin-server-web:b69faa4d
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/public/lang
              subPath: public-lang
              readOnly: true
            - name: data
              mountPath: /var/www/html/public/plugins
              subPath: public-plugins
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcskin-data
